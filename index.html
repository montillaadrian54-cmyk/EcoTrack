<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EcoTrack · Barangay Waste Collection Monitoring</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <!-- EcoTrack Logo -->
      <div class="login-brand">
        <img
          src="assets/ecotrack-logo.png"
          alt="EcoTrack Logo"
          class="login-logo"
        />
      </div>

      <p class="muted">
        Barangay Waste Collection and Missed Pickup Monitoring System
      </p>
      <div id="msg"></div>
      <div class="tabs">
        <button class="tab on" data-t="login">Log in</button
        ><button class="tab" data-t="register">Register (resident)</button>
      </div>

      <form id="login" class="stack">
        <label
          >Email<input type="email" name="email" required autocomplete="email"
        /></label>
        <label
          >Password<input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        /></label>
        <button class="btn" type="submit">Log in</button>
        <a href="#" id="forgot" class="muted">Forgot password?</a>
      </form>

      <form id="register" class="stack" hidden>
        <label
          >Full name<input name="full_name" required maxlength="80"
        /></label>
        <label
          >Mobile number (for SMS)<input
            name="phone"
            placeholder="09171234567"
            required
        /></label>
        <label
          >Your purok<select name="zone" id="zones" required>
            <option value="">Loading puroks…</option>
          </select></label
        >
        <label
          >Email<input type="email" name="email" required autocomplete="email"
        /></label>
        <label
          >Password (min. 8 characters)<input
            type="password"
            name="password"
            minlength="8"
            required
            autocomplete="new-password"
        /></label>
        <button class="btn" type="submit">Create resident account</button>
        <p class="muted">
          Collector and official accounts are created by the barangay
          administrator.
        </p>
      </form>
    </div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
